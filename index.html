<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bảng lương PRO FINAL</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<style>
body{margin:0;background:#0f172a;color:#fff;font-family:sans-serif}
.container{max-width:500px;margin:auto;padding:10px}
.card{background:#1e293b;padding:10px;border-radius:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input{padding:10px;border-radius:10px;border:none;background:#334155;color:#fff;width:100%}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{padding:6px;border-radius:10px;text-align:center;font-size:12px;background:#334155}
.header{background:#000}
.work{background:#16a34a}
.off{background:#475569}
.half{background:#f59e0b}
.future{opacity:0.3}
.today{outline:2px solid yellow}
.btn{width:100%;padding:10px;border-radius:10px;background:#22c55e;color:#000;font-weight:bold;border:none;margin-top:8px}
</style>
</head>

<body>
<div class="container">
<h2 id="title">📊 Bảng lương</h2>

<div class="card grid">
<input id="name" placeholder="Tên">
<input id="base" type="number" placeholder="Lương">
<input id="allow" type="number" placeholder="Phụ cấp/ngày">
<input id="advance" type="number" placeholder="Ứng lương">
</div>

<button class="btn" onclick="updateNow()">🔄 CẬP NHẬT</button>

<div class="card">
<div id="monthTitle" style="text-align:center"></div>
<div id="calendar" class="calendar"></div>
</div>

<div class="card" id="result"></div>
</div>

<script>
const name = document.getElementById('name');
const base = document.getElementById('base');
const allow = document.getElementById('allow');
const advance = document.getElementById('advance');
const calendar = document.getElementById('calendar');
const result = document.getElementById('result');
const monthTitle = document.getElementById('monthTitle');
const title = document.getElementById('title');

let now=new Date();
let year=now.getFullYear();
let month=now.getMonth();
let today=now.getDate();

function key(k){return `${k}_${year}_${month}`}

// LOAD
function loadData(){
 let backup = JSON.parse(localStorage.getItem("backup_salary") || "{}");

 name.value = localStorage.getItem('name_global') || backup.name || '';
 base.value = localStorage.getItem(key('base')) || backup.base || '';
 allow.value = localStorage.getItem(key('allow')) || backup.allow || '';
 advance.value = localStorage.getItem(key('adv')) || backup.adv || '';

 updateTitle();
}

// SAVE
function saveAll(){
 localStorage.setItem('name_global',name.value);
 localStorage.setItem(key('base'),base.value);
 localStorage.setItem(key('allow'),allow.value);
 localStorage.setItem(key('adv'),advance.value);

 localStorage.setItem("backup_salary", JSON.stringify({
  name:name.value,
  base:base.value,
  allow:allow.value,
  adv:advance.value
 }));
}

name.oninput = ()=>{
 localStorage.setItem('name_global',name.value);
 updateTitle();
}

function updateTitle(){
 if(name.value) title.innerText = "📊 " + name.value;
 else title.innerText = "📊 Bảng lương";
}

function isSunday(d){return new Date(year,month,d).getDay()===0}

// CALC
function calc(){
 let baseVal=+base.value||0;
 let allowVal=+allow.value||0;
 let adv=+advance.value||0;
 let days=new Date(year,month+1,0).getDate();

 let daySalary=Math.round(baseVal/26)||0;
 let hourSalary=Math.round(daySalary/8)||0;

 let work=0, ot=0;

 for(let i=1;i<=days;i++){
  if(i>today) continue;
  if(isSunday(i)) continue;

  let status=localStorage.getItem(key(`status_${i}`));

  if(status==='off'){}
  else if(status==='half') work+=0.5;
  else work++;

  ot+=(+localStorage.getItem(key(`ot_${i}`))||0);
 }

 let bonus = work>=26 ? 200000 : 0;
 let total = work*daySalary + work*allowVal + ot*hourSalary*1.5 + bonus - adv;

 result.innerHTML=`
 Công: ${work}<br>
 OT: ${ot}h<br>
 Thưởng: ${bonus.toLocaleString()}<br>
 Ứng: -${adv.toLocaleString()}<br>
 <b style="color:#22c55e;font-size:18px">${total.toLocaleString()}đ</b>
 `;
}

// BUTTON
function updateNow(){
 saveAll();
 calc();
}

// RENDER
function render(){
 calendar.innerHTML='';
 let days=new Date(year,month+1,0).getDate();

 monthTitle.innerText=`Tháng ${month+1}/${year}`;

 ['CN','T2','T3','T4','T5','T6','T7'].forEach(d=>{
  let h=document.createElement('div');
  h.innerText=d;
  h.className='day header';
  calendar.appendChild(h);
 });

 let first=new Date(year,month,1).getDay();
 for(let i=0;i<first;i++) calendar.appendChild(document.createElement('div'));

 for(let i=1;i<=days;i++){
  let div=document.createElement('div');
  div.className='day';

  let status=localStorage.getItem(key(`status_${i}`));

  div.innerHTML=`${i}<br><input type="number" placeholder="OT" value="${localStorage.getItem(key(`ot_${i}`))||''}">`;

  if(i>today || isSunday(i)) div.classList.add('future');
  else if(status==='off') div.classList.add('off');
  else if(status==='half') div.classList.add('half');
  else div.classList.add('work');

  if(i===today) div.classList.add('today');

  let input=div.querySelector('input');
  input.oninput=e=>{
   localStorage.setItem(key(`ot_${i}`),e.target.value);
  };

  div.onclick=e=>{
   if(e.target===input||i>today||isSunday(i)) return;

   let cur=localStorage.getItem(key(`status_${i}`));

   if(!cur) localStorage.setItem(key(`status_${i}`),'half');
   else if(cur==='half') localStorage.setItem(key(`status_${i}`),'off');
   else localStorage.removeItem(key(`status_${i}`));

   render();
  };

  calendar.appendChild(div);
 }
}

if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js');
}

loadData();
render();
calc();
</script>
</body>
</html>
