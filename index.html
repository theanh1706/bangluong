<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO MAX FINAL V2 FIX</title>
<meta name="theme-color" content="#0f172a">
<style>
body{margin:0;background:#0f172a;color:#fff;font-family:sans-serif}
.container{max-width:520px;margin:auto;padding:10px}

/* TAB */
.tabs{display:flex;gap:5px;margin-bottom:10px}
.tabBtn{flex:1;padding:10px;border:none;border-radius:10px;background:#334155;color:#fff;cursor:pointer}
.active{background:#22c55e;color:#000}

/* ===== STYLE CŨ ===== */
.card{background:#1e293b;padding:10px;border-radius:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:8px}
input{padding:10px;border-radius:10px;border:none;background:#334155;color:#fff;width:100%}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{padding:6px;border-radius:10px;text-align:center;font-size:12px;background:#334155;cursor:pointer}
.header{background:#000}
.work{background:#16a34a}
.off{background:#7f1d1d}
.half{background:#f59e0b}
.future{opacity:0.3}
.today{outline:2px solid yellow}
.btn{width:100%;padding:10px;border-radius:10px;background:#22c55e;color:#000;font-weight:bold;border:none;margin-top:6px;cursor:pointer}
.row{display:flex;gap:5px}
.stat{font-size:13px;color:#94a3b8}
.big{font-size:22px;color:#22c55e;text-align:center;font-weight:bold}
.warn{color:#f59e0b;font-size:13px;text-align:center}

/* TAB 2 */
.noteItem{display:flex;gap:5px;margin-bottom:5px}
.noteItem input{flex:1}

/* TAB 3 */
.remindItem{background:#334155;padding:8px;border-radius:10px;margin-bottom:5px;font-size:13px}
.overdue{background:#7f1d1d}
.todayTask{background:#f59e0b;color:#000}
</style>
</head>
<body>
<div class="container">

<!-- TAB -->
<div class="tabs">
<button class="tabBtn active" onclick="switchTab(1)">💰 Tính lương</button>
<button class="tabBtn" onclick="switchTab(2)">📊 Tài chính</button>
<button class="tabBtn" onclick="switchTab(3)">📅 Lịch nhắc</button>
</div>

<!-- ================= TAB 1 ================= -->
<div id="tab1">

<h2 id="title">📊 Bảng lương</h2>

<div class="card grid">
<input id="name" placeholder="Tên">
<input id="base" placeholder="Lương">
<input id="advance" placeholder="Ứng lương">
<input id="insurance" placeholder="Bảo hiểm">
<input id="predictDays" type="number" placeholder="Nhập số ngày dự đoán (tuỳ chọn)">
</div>

<button class="btn" onclick="calc()">🔄 CẬP NHẬT</button>
<button class="btn" onclick="predictSalary()">🔮 Dự đoán</button>
<button class="btn" onclick="showOTMoney()">💰 Tổng tiền tăng ca</button>
<button class="btn" onclick="resetAll()">🗑 RESET DATA</button>

<div class="card warn" id="notify"></div>
<div class="card">
<div class="row">
<button class="btn" onclick="prevMonth()">⬅️</button>
<button class="btn" onclick="nextMonth()">➡️</button>
</div>
<div id="monthTitle" style="text-align:center;margin-top:5px"></div>
<div id="calendar" class="calendar"></div>
</div>

<div class="card stat" id="stats"></div>
<div class="card big" id="result"></div>

</div>

<!-- ================= TAB 2 ================= -->
<div id="tab2" style="display:none">

<h2>📊 Quản lý chi tiêu PRO</h2>

<div class="card">
<div class="row">
<button class="btn" onclick="prevFinanceMonth()">⬅️</button>
<button class="btn" onclick="nextFinanceMonth()">➡️</button>
</div>

<div id="financeMonth" style="text-align:center;margin:5px 0"></div>

<div id="noteList"></div>

<button class="btn" onclick="addNote()">➕ Thêm chi tiêu</button>
<button class="btn" onclick="clearNote()">🗑 Xóa tháng này</button>

<div class="big" id="totalSpend"></div>
<div class="stat" id="categoryStats"></div>

</div>
</div>

<!-- ================= TAB 3 ================= -->
<div id="tab3" style="display:none">

<h2>📅 Lịch nhắc việc</h2>

<div class="card">
<div class="row">
<button class="btn" onclick="prevRemindMonth()">⬅️</button>
<button class="btn" onclick="nextRemindMonth()">➡️</button>
</div>

<div id="remindMonth" style="text-align:center;margin:5px 0"></div>

<input id="taskText" placeholder="Nhập việc...">
<input id="taskDate" type="date">

<button class="btn" onclick="addTask()">➕ Thêm việc</button>

<div id="taskList"></div>

</div>

</div>

</div>

<script>

/* ================= TAB SWITCH ================= */
function switchTab(n){
 document.getElementById('tab1').style.display = n===1?'block':'none';
 document.getElementById('tab2').style.display = n===2?'block':'none';
 document.getElementById('tab3').style.display = n===3?'block':'none';
 document.querySelectorAll('.tabBtn').forEach((b,i)=>{
  b.classList.toggle('active',i===n-1);
 });

 if(n===2){updateFinanceTitle();loadNote();}
 if(n===3){updateRemindTitle();loadTask();}
}

/* ================= TAB 1 ================= */
const name=document.getElementById('name');
const base=document.getElementById('base');
const advance=document.getElementById('advance');
const insurance=document.getElementById('insurance');
const predictDays=document.getElementById('predictDays');
const calendar=document.getElementById('calendar');
const result=document.getElementById('result');
const stats=document.getElementById('stats');
const notify=document.getElementById('notify');
const monthTitle=document.getElementById('monthTitle');
const title=document.getElementById('title');

let now=new Date(), year=now.getFullYear(), month=now.getMonth(), today=now.getDate();

function key(k){return `${k}_${year}_${month}`;}
function money(n){return Number(Math.round(n||0)).toLocaleString("vi-VN");}
function formatInput(input){
 let raw=input.value.replace(/\D/g,'');
 input.value=raw?Number(raw).toLocaleString("vi-VN"):'';
}
function getNumber(val){return Number((val||'').replace(/\./g,''))||0;}

/* SAVE FIX */
function save(){
 localStorage.setItem('user_name',name.value);
 localStorage.setItem(key('base'),base.value);
 localStorage.setItem(key('adv'),advance.value);
 localStorage.setItem(key('insurance'),insurance.value);
}

/* FIX NAME REALTIME */
name.addEventListener('input', ()=>{
 localStorage.setItem('user_name', name.value);
 updateTitle();
});

/* INPUT EVENTS */
[name,insurance].forEach(i=>{i.addEventListener('input',()=>{save();calc();});});
[base,advance].forEach(i=>{i.addEventListener('input',()=>{formatInput(i);save();calc();});});

/* LOAD FIX */
function load(){
 name.value=localStorage.getItem('user_name')||'';
 base.value=localStorage.getItem(key('base'))||'';
 advance.value=localStorage.getItem(key('adv'))||'';
 insurance.value=localStorage.getItem(key('insurance'))||'';
 updateTitle();
}

function updateTitle(){title.innerText=name.value?"📊 "+name.value:"📊 Bảng lương";}
function isSunday(d){return new Date(year,month,d).getDay()===0;}

function calc(){
 let baseVal=getNumber(base.value);
 let adv=getNumber(advance.value);
 let ins=getNumber(insurance.value);
 let days=new Date(year,month+1,0).getDate();
 let daySalary=baseVal/26;
 let hourSalary=daySalary/8;
 let work=0, ot=0;
 let nowDate = new Date();

 for(let i=1;i<=days;i++){
  let d=new Date(year,month,i);
  if(d>nowDate) continue;
  if(isSunday(i)) continue;
  let s=localStorage.getItem(key(`status_${i}`));
  if(s==='off'){}
  else if(s==='half') work+=0.5;
  else work++;
  ot+=(+localStorage.getItem(key(`ot_${i}`))||0);
 }

 let allowPerDay = 1000000/26;
 let allowMoney = work*allowPerDay;
 let bonus = work>=26?200000:0;
 let otMoney = ot*hourSalary*1.5;
 let total = work*daySalary + allowMoney + otMoney + bonus - adv - ins;

 stats.innerHTML=`Ngày làm: ${work} | OT: ${ot}h | 💰 OT: ${money(otMoney)}đ | 🎁 PC: ${money(allowMoney)}đ`;
 result.innerText=money(total)+"đ";
 notify.innerText = ins>0 ? "💉 Bảo hiểm: "+money(ins)+"đ trừ vào lương" : "";
}

/* FIX ĐỔI THÁNG */
function prevMonth(){month--; if(month<0){month=11;year--;} load(); render(); calc();}
function nextMonth(){month++; if(month>11){month=0;year++;} load(); render(); calc();}

function render(){
 calendar.innerHTML='';
 let days=new Date(year,month+1,0).getDate();
 monthTitle.innerText=`Tháng ${month+1}/${year}`;
 ['CN','T2','T3','T4','T5','T6','T7'].forEach(d=>{let h=document.createElement('div'); h.innerText=d; h.className='day header'; calendar.appendChild(h);});
 let first=new Date(year,month,1).getDay();
 for(let i=0;i<first;i++) calendar.appendChild(document.createElement('div'));
 let nowDate = new Date();
 for(let i=1;i<=days;i++){
  let div=document.createElement('div'); div.className='day';
  let d=new Date(year,month,i);
  let status=localStorage.getItem(key(`status_${i}`));
  let otVal = (d<=nowDate && !isSunday(i)) ? localStorage.getItem(key(`ot_${i}`))||'' : '';
  div.innerHTML=`${i}<br><input type="number" value="${otVal}">`;
  if(d>nowDate) div.classList.add('future');
  else if(status==='off') div.classList.add('off');
  else if(status==='half') div.classList.add('half');
  else if(!isSunday(i)) div.classList.add('work');
  if(d.toDateString()===nowDate.toDateString()) div.classList.add('today');

  let input=div.querySelector('input');
  input.oninput=e=>{if(d>nowDate || isSunday(i)) return; localStorage.setItem(key(`ot_${i}`),e.target.value); calc();};

  div.onclick=e=>{
      if(e.target===input || d>nowDate || isSunday(i)) return;
      let cur=localStorage.getItem(key(`status_${i}`));
      if(!cur)localStorage.setItem(key(`status_${i}`),'half');
      else if(cur==='half')localStorage.setItem(key(`status_${i}`),'off');
      else localStorage.removeItem(key(`status_${i}`));
      render(); calc();
  };
  calendar.appendChild(div);
 }
}

load();render();calc();

/* CHỐNG MẤT DATA */
setInterval(save,2000);
window.addEventListener("beforeunload", save);

/* ===== TAB 2 & 3 GIỮ NGUYÊN ===== */
/* ================= TAB 2 PRO ================= */

let fDate=new Date(), fMonth=fDate.getMonth(), fYear=fDate.getFullYear();

function fKey(){return `finance_${fYear}_${fMonth}`;}

function updateFinanceTitle(){
 document.getElementById('financeMonth').innerText=`Tháng ${fMonth+1}/${fYear}`;
}

function addNote(text='',money='',cat='Ăn uống'){
 let div=document.createElement('div');
 div.className='noteItem';

 div.innerHTML=`
 <input placeholder="Nội dung" value="${text}">
 <input type="number" placeholder="Tiền" value="${money}">
 <select>
   <option ${cat=='Ăn uống'?'selected':''}>Ăn uống</option>
   <option ${cat=='Sinh hoạt'?'selected':''}>Sinh hoạt</option>
   <option ${cat=='Di chuyển'?'selected':''}>Di chuyển</option>
   <option ${cat=='Khác'?'selected':''}>Khác</option>
 </select>
 <button onclick="this.parentElement.remove(); saveNote()">❌</button>
 `;

 document.getElementById('noteList').appendChild(div);

 div.querySelectorAll('input,select').forEach(i=>{
   i.addEventListener('input', saveNote);
   i.addEventListener('change', saveNote);
 });
}

function saveNote(){
 let arr=[];
 document.querySelectorAll('.noteItem').forEach(n=>{
   arr.push({
     text:n.children[0].value,
     money:n.children[1].value,
     cat:n.children[2].value
   });
 });
 localStorage.setItem(fKey(),JSON.stringify(arr));
 calcFinance();
}

function loadNote(){
 document.getElementById('noteList').innerHTML='';
 let data=JSON.parse(localStorage.getItem(fKey())||'[]');
 data.forEach(d=>addNote(d.text,d.money,d.cat));
 calcFinance();
}

function calcFinance(){
 let total=0;
 let catTotal={};

 document.querySelectorAll('.noteItem').forEach(n=>{
   let money=Number(n.children[1].value||0);
   let cat=n.children[2].value;

   total+=money;
   catTotal[cat]=(catTotal[cat]||0)+money;
 });

 document.getElementById('totalSpend').innerText=
   "💸 Tổng: "+total.toLocaleString("vi-VN")+"đ";

 let html="📊 Theo loại:<br>";
 for(let c in catTotal){
   html+=`${c}: ${catTotal[c].toLocaleString("vi-VN")}đ<br>`;
 }
 document.getElementById('categoryStats').innerHTML=html;
}

function clearNote(){
 if(confirm("Xóa chi tiêu tháng này?")){
   localStorage.removeItem(fKey());
   loadNote();
 }
}

function prevFinanceMonth(){
 fMonth--;
 if(fMonth<0){fMonth=11;fYear--;}
 updateFinanceTitle();
 loadNote();
}

function nextFinanceMonth(){
 fMonth++;
 if(fMonth>11){fMonth=0;fYear++;}
 updateFinanceTitle();
 loadNote();
}

updateFinanceTitle();
loadNote();

/* chống mất dữ liệu */
setInterval(saveNote,2000);
window.addEventListener("beforeunload", saveNote);

let rDate=new Date(), rMonth=rDate.getMonth(), rYear=rDate.getFullYear();
function rKey(){return `remind_${rYear}_${rMonth}`;}
function updateRemindTitle(){document.getElementById('remindMonth').innerText=`Tháng ${rMonth+1}/${rYear}`;}
function addTask(){let text=document.getElementById('taskText').value; let date=document.getElementById('taskDate').value; if(!text||!date)return alert("Nhập đủ!"); let arr=JSON.parse(localStorage.getItem(rKey())||'[]'); arr.push({text,date}); localStorage.setItem(rKey(),JSON.stringify(arr)); document.getElementById('taskText').value=''; document.getElementById('taskDate').value=''; loadTask();}
function loadTask(){let list=document.getElementById('taskList'); list.innerHTML=''; let arr=JSON.parse(localStorage.getItem(rKey())||'[]'); let todayStr=new Date().toISOString().split('T')[0]; arr.forEach((t,i)=>{let div=document.createElement('div'); div.className='remindItem'; if(t.date===todayStr) div.classList.add('todayTask'); else if(t.date<todayStr) div.classList.add('overdue'); div.innerHTML=`📌 ${t.text}<br>📅 ${t.date} <button onclick="delTask(${i})">❌</button>`; list.appendChild(div);});}
function delTask(i){let arr=JSON.parse(localStorage.getItem(rKey())||'[]'); arr.splice(i,1); localStorage.setItem(rKey(),JSON.stringify(arr)); loadTask();}
function prevRemindMonth(){rMonth--;if(rMonth<0){rMonth=11;rYear--;}updateRemindTitle();loadTask();}
function nextRemindMonth(){rMonth++;if(rMonth>11){rMonth=0;rYear++;}updateRemindTitle();loadTask();}
updateRemindTitle(); loadTask();

</script>
</body>
</html>
